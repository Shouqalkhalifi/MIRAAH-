{% extends "base.html" %}
{% block title %}تحليل جديد{% endblock %}
{% block content %}
<script>
  function inputState() {
    return {
      title: '', source: { text: '', lang: 'ar', source_ref: '', content_level: 'B' },
      versions: [{ label: 'v1', lang: 'en', derived_from: 'source', text: '' }],
      locks: [], sending: false, error: '', suggesting: false,
      async suggestLocks() {
        if (!this.source.text.trim()) { this.error = 'أدخل الأصل أولاً'; return; }
        this.suggesting = true; this.error = '';
        try {
          const res = await fetch('/api/locks/suggest', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: this.source.text, lang: this.source.lang }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.statusText);
          const have = new Set(this.locks.map(l => l.span_text));
          data.forEach(l => { if (!have.has(l.span_text)) this.locks.push(l); });
          if (!data.length) this.error = 'لم نجد مقاطع مقترحة؛ يمكنك إضافة أقفال يدوياً.';
        } catch (e) { this.error = String(e.message || e); }
        this.suggesting = false;
      },
      addVersion() {
        const last = this.versions[this.versions.length - 1];
        this.versions.push({ label: 'v' + (this.versions.length + 1), lang: 'en', derived_from: last.label, text: '' });
      },
      async submit() {
        this.error = ''; this.sending = true;
        const body = { title: this.title, source: this.source, versions: this.versions,
                       locks: this.locks.filter(l => l.span_text.trim()) };
        try {
          const res = await fetch('/api/analyze?background=true', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const data = await res.json();
          if (!res.ok) throw new Error((data.detail && (data.detail[0]?.msg || data.detail)) || res.statusText);
          location.href = '/analyze/' + data.id;
        } catch (e) { this.error = String(e.message || e); this.sending = false; }
      }
    };
  }
</script>
<form @submit.prevent="submit()" class="space-y-6" x-data="inputState()">
  <section class="bg-white rounded-2xl shadow p-6 space-y-4">
    <h1 class="text-2xl font-bold">الأصل العربي</h1>
    <label class="block">العنوان (اختياري)
      <input class="w-full border rounded-xl p-2" x-model="title" placeholder="مثال: رخصة الفطر للمسافر"></label>
    <textarea class="w-full border rounded-xl p-3 h-32" x-model="source.text" placeholder="الصق النص المصدر هنا" required></textarea>
    <div class="grid md:grid-cols-2 gap-4">
      <label class="block">المرجع
        <input class="w-full border rounded-xl p-2" x-model="source.source_ref" placeholder="مثال: كتاب الصيام، ص 12"></label>
      <label class="block">مستوى المحتوى
        <select class="w-full border rounded-xl p-2" x-model="source.content_level">
          <option value="A">A — نصوص منسوبة إلى الله ورسوله ﷺ (أعلى حساسية)</option>
          <option value="B">B — أحكام وفتاوى منقولة</option>
          <option value="C">C — محتوى دعوي وتربوي عام</option>
          <option value="D">D — خارج النطاق (إحالة)</option>
        </select></label>
    </div>
  </section>

  <section class="bg-white rounded-2xl shadow p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold">النسخ (حتى 4)</h2>
      <button type="button" class="bg-teal text-navy rounded-xl px-3 py-1 disabled:opacity-40"
              :disabled="versions.length >= 4" @click="addVersion()">+ نسخة</button>
    </div>
    <template x-for="(v, i) in versions" :key="i">
      <div class="border rounded-xl p-4 space-y-2">
        <div class="grid md:grid-cols-3 gap-2">
          <label>التسمية <input class="w-full border rounded p-1" x-model="v.label" required></label>
          <label>اللغة
            <select class="w-full border rounded p-1" x-model="v.lang">
              <option value="en">English</option><option value="fr">Français</option>
              <option value="id">Bahasa Indonesia</option><option value="ur">اردو</option><option value="ar">العربية</option>
            </select></label>
          <label>الحلقة الأم
            <select class="w-full border rounded p-1" x-model="v.derived_from">
              <option value="source">الأصل</option>
              <template x-for="p in versions.slice(0, i)"><option :value="p.label" x-text="p.label" :selected="p.label === v.derived_from"></option></template>
            </select></label>
        </div>
        <textarea class="w-full border rounded p-2 h-24" x-model="v.text" placeholder="نص النسخة" required></textarea>
        <button type="button" x-show="versions.length > 1" @click="versions.splice(i,1)" class="text-red-600 text-sm">حذف</button>
      </div>
    </template>
  </section>

  <section class="bg-white rounded-2xl shadow p-6 space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold">أقفال المعنى 🔒</h2>
      <div class="flex gap-2">
        <button type="button" class="border border-violet text-violet rounded-xl px-3 py-1 disabled:opacity-50" :disabled="suggesting"
                @click="suggestLocks()" x-text="suggesting ? 'جارٍ الاقتراح…' : 'اقترح أقفالاً'"></button>
        <button type="button" class="bg-teal text-navy rounded-xl px-3 py-1" @click="locks.push({span_text:'', lock_type:'condition', origin:'user'})">+ قفل</button>
      </div>
    </div>
    <p class="text-sm text-navy/60">حدّد مقطعاً من الأصل (كما ورد فيه حرفياً) يجب أن يبقى معناه في كل النسخ. أي نسخة تكسره تُنبَّه باللون الأحمر.</p>
    <template x-for="(l, i) in locks" :key="i">
      <div class="flex gap-2">
        <input class="flex-1 border rounded p-1" x-model="l.span_text" placeholder="المقطع، مثل: للمسافر">
        <span x-show="l.origin === 'auto'" class="text-xs text-violet self-center">مقترح</span>
        <select class="border rounded p-1" x-model="l.lock_type">
          <option value="condition">شرط</option><option value="certainty">يقين</option>
          <option value="exception">استثناء</option><option value="attribution">نسبة</option>
          <option value="grade">درجة</option><option value="term">مصطلح</option>
          <option value="negation">نفي</option><option value="number">رقم</option>
        </select>
        <button type="button" @click="locks.splice(i,1)" class="text-red-600">✕</button>
      </div>
    </template>
  </section>

  <p x-show="error" x-cloak class="bg-red-50 border border-red-300 rounded-xl p-3 text-red-700" x-text="error"></p>
  <button class="bg-violet text-white rounded-xl px-6 py-3 text-lg disabled:opacity-50" :disabled="sending"
          x-text="sending ? 'جارٍ الإرسال…' : 'حلّل'"></button>
</form>
{% endblock %}
