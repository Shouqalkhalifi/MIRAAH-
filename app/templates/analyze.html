{% extends "base.html" %}
{% block title %}تجري المقابلة{% endblock %}
{% block content %}
<script>
  function progressState() {
    return {
      steps: {{ stages | tojson }}, done: 0, status: 'analyzing', error: '',
      async poll() {
        try {
          const r = await (await fetch('/api/report/{{ report.id }}/status')).json();
          this.status = r.status; this.error = r.error;
          this.done = Math.max(0, r.stage_index);
          if (r.status === 'analyzed') { this.done = this.steps.length; setTimeout(() => location.href = '/report/{{ report.id }}', 400); return; }
          if (r.status === 'failed') return;
        } catch (e) { /* إعادة المحاولة */ }
        setTimeout(() => this.poll(), 1000);
      }
    };
  }
</script>
<section class="seal" x-data="progressState()" x-init="poll()">
  <h1 class="t28" x-text="status === 'failed' ? 'تعذّر التحليل' : (status === 'analyzed' ? 'اكتملت المقابلة' : 'تجري المقابلة…')" role="status">تجري المقابلة…</h1>
  <p class="t14 muted" style="margin:.25rem 0 0">{{ report.title or 'مقابلة جديدة' }} · {{ report.versions | length }} حلقات</p>
  <ol class="steps" aria-label="مراحل المقابلة">
    <template x-for="(s, i) in steps" :key="i">
      <li :class="i < done ? 'done' : (i === done && status === 'analyzing' ? 'now' : '')" x-text="s"></li>
    </template>
  </ol>
  <div x-show="status === 'failed'" x-cloak class="banner rubric" style="margin-top:1rem">
    <p style="margin:0 0 .25rem" x-text="(error || '').split('\n— التفاصيل التقنية: ')[0]"></p>
    <details x-show="(error || '').includes('التفاصيل التقنية')"><summary class="muted">التفاصيل التقنية</summary>
      <p dir="ltr" class="hash" style="word-break:break-all" x-text="(error || '').split('\n— التفاصيل التقنية: ')[1]"></p></details>
    <a class="btn btn-quiet" href="/" style="margin-top:.5rem">ابدأ مقابلة جديدة</a>
  </div>
</section>
{% endblock %}
