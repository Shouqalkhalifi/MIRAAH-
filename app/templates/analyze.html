{% extends "base.html" %}
{% block title %}جارٍ التحليل{% endblock %}
{% block content %}
<section class="bg-white rounded-2xl shadow p-8 max-w-2xl mx-auto"
  x-data="{ steps: ['تقسيم الجمل', 'محاذاة النسخ بالأصل', 'استخراج بصمة المعنى', 'مقارنة البصمات وتطبيق القواعد', 'تحديد الحلقة التي دخل فيها الخلل', 'الميزان: التحقق من المصادر', 'إعداد التقرير'], done: 0 }"
  x-init="let t = setInterval(() => { done++; if (done >= steps.length) { clearInterval(t); setTimeout(() => location.href = '/report/{{ report_id }}', 500) } }, 450)">
  <h1 class="text-2xl font-bold mb-6">جارٍ التحليل…</h1>
  <div class="w-full bg-paper rounded-full h-3 mb-6">
    <div class="bg-violet h-3 rounded-full transition-all" :style="`width: ${done / steps.length * 100}%`"></div>
  </div>
  <ol class="space-y-2">
    <template x-for="(s, i) in steps" :key="i">
      <li class="flex items-center gap-2" :class="i < done ? 'text-navy' : 'text-navy/40'">
        <span x-text="i < done ? '✅' : (i === done ? '⏳' : '◻️')"></span><span x-text="s"></span>
      </li>
    </template>
  </ol>
  <p class="text-xs text-navy/50 mt-6">في المرحلة 0 هذه محاكاة للواجهة فقط.</p>
</section>
{% endblock %}
