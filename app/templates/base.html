<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}مِرآة{% endblock %} · MIRAAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy: '#12183F', violet: '#6150EA', teal: '#2EF2C2', paper: '#F2F4FF' },
      fontFamily: { sans: ['Readex Pro', 'system-ui', 'sans-serif'] } } } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-navy text-white">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
      <a href="/" class="text-2xl font-bold">مِرآة <span class="text-teal text-sm font-normal">MIRAAH</span></a>
      <div class="flex gap-3 text-sm opacity-90 flex-wrap">
        <a href="/new" class="hover:text-teal">تحليل جديد</a>
        <a href="/report/demo" class="hover:text-teal">التقرير</a>
        <a href="/review/demo" class="hover:text-teal">المراجعة</a>
        <a href="/seal/demo" class="hover:text-teal">الختم</a>
        <a href="/docs" class="hover:text-teal">API</a>
      </div>
      <span class="ms-auto text-xs bg-violet/80 rounded px-2 py-1">المرحلة 0 · بيانات وهمية</span>
    </nav>
  </header>
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">{% block content %}{% endblock %}</main>
  <footer class="bg-navy text-white/80 text-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap gap-2 justify-between">
      <p role="note" class="font-semibold text-teal">⚠️ {{ DISCLAIMER }}.</p>
      <p>«نحافظ على المعنى، لا على الكلمات فقط»</p>
    </div>
  </footer>
</body>
</html>
