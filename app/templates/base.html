<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}مِرآة{% endblock %} · MIRAAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/static/favicon-180.png">
</head>
<body>
{% set path = request.url.path %}
  <header class="topbar">
    <div class="topbar-in">
      <a href="/" class="brand" aria-label="مِرآة — مقابلة جديدة">مِرآة <small dir="ltr">MIRAAH</small></a>
      <nav class="topnav" aria-label="التنقل">
        <a href="/" {% if path in ['/', '/new'] %}aria-current="page"{% endif %}>مقابلة جديدة</a>
        <a href="/reverse" {% if path.startswith('/reverse') %}aria-current="page"{% endif %}>قابِل ما قرأت</a>
        <a href="/docs">التوثيق</a>
      </nav>
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <footer class="foot">
    <div class="foot-in">
      <p role="note">{{ DISCLAIMER }}.</p>
      <p>نحافظ على المعنى، لا على الكلمات فقط</p>
    </div>
  </footer>
</body>
</html>
